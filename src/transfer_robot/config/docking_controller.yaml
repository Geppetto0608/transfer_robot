docking_controller:
  ros__parameters:
    pose_topic: /detected_dock_pose
    confidence_topic: /bed_detection/confidence
    detection_mode_topic: /bed_detection/mode
    cmd_vel_topic: /cmd_vel
    pose_frame: base_link
    mode_feedback_topic: /drive_mode_feedback
    require_mode_feedback: true
    enabled: false
    # 기본 실기 흐름: 사전정렬 후 INSERT까지 연속 수행한다.
    prealign_only: false
    # INSERT 시작 후 0.20 m까지는 FOOT만 사용하고 그 뒤 TOP 검출을 시작한다.
    top_handoff_start_distance: 0.20
    # 첫 전환 시험은 TOP 검색 시작 후 추가 0.35 m 안에 전환하지 못하면 정지한다.
    stop_on_top_handoff: false
    top_handoff_test_max_insert_distance: 0.35
    use_sim_time: false

    min_confidence: 0.35
    # 실측상 pose 간격이 순간적으로 최대 2.4 s까지 벌어져 1.5 s에서는
    # 정상 검출 중에도 LOST가 발생했다. 3.0 s 동안 완전히 끊긴 경우만 LOST.
    detection_timeout: 3.0

    # Stage 1: ACKERMANN 직선 주행으로 발판 수직 중심선(cross=0)에 정렬.
    prealign_cross_tolerance: 0.08
    prealign_hold_frames: 3
    mode_switch_stop_frames: 5
    mode_switch_settle_frames: 5
    mode_switch_timeout: 8.0
    prealign_max_linear: 0.04
    prealign_min_linear: 0.01
    prealign_k_cross: 0.6

    # Stage 2: 완전 정지 후 DIFF 제자리 회전으로 침대 각도 정렬.
    angle_align_yaw_tolerance: 0.035  # 약 2도
    angle_align_hold_frames: 5
    angle_align_max_angular: 0.05
    angle_align_min_angular: 0.015
    angle_align_k_yaw: 0.4

    # 정렬 완료 위치의 실측 along 약 1.105 m에서 2.0 m 진입하도록 계산한
    # 목표값이다: 1.105 - 2.0 = -0.895 m -> -0.90 m. 이 위치에 도달하면
    # DOCKED로 정지하고, 배출은 /docking_controller/retract 서비스에 true가
    # 들어왔을 때만 시작한다.
    target_bed_yaw: -1.57079632679
    target_entrance_along: -0.90
    target_cross: 0.0

    # Stage 3: DIFF로 base -Y 방향 진입하며 cross/yaw를 동시 보정.
    stop_along: 0.05
    stop_cross: 0.05
    stop_yaw: 0.06
    insert_max_speed: 0.08 #0.2
    insert_max_reverse_speed: 0.02
    insert_max_angular: 0.05
    insert_k_along: 0.4
    insert_k_cross: 0.7
    insert_k_yaw: 0.6
    # 정지 실측 검출 흔들림보다 작은 오차는 따라가지 않는다.
    insert_cross_deadband: 0.02
    insert_yaw_deadband: 0.02
    insert_abort_cross: 0.25
    insert_abort_yaw: 0.20
    # top LiDAR 벽 평면이 현재 정지 위치의 실측 간격 1.03 m에 접근하면
    # 하드코딩 거리보다 먼저 정지한다. 벽이 아직 시야 밖이거나 순간적으로
    # 사라진 구간에서는 WALL_NOT_DETECTED를 만들지 않고 기존 INSERT를 유지한다.
    wall_range_topic: /bed_detection/wall_range
    wall_required_for_insert: false
    wall_stop_distance: 1.05
    wall_range_timeout: 0.60
    wall_stop_confirm_frames: 5
    # 서비스 기반 배출: DIFF에서 +base Y로 이동하면서 침대 중심/각도를 보정한다.
    # 자동 거리 제한은 사용하지 않으며 작업자가 정지 서비스를 호출할 때까지
    # 계속 배출한다. pose 유실/낮은 신뢰도/큰 정렬 오차 안전 정지는 유지한다.
    retract_speed: 0.08
    retract_max_angular: 0.05
    retract_k_cross: 0.7
    retract_k_yaw: 0.6
    retract_cross_deadband: 0.02
    retract_yaw_deadband: 0.02
    retract_abort_cross: 0.25
    retract_abort_yaw: 0.20
    control_rate: 20.0

platform_mode_bridge:
  ros__parameters:
    request_topic: /drive_mode
    hardware_mode_topic: /mode
    hardware_status_topic: /motor_node/drive_mode
    feedback_topic: /drive_mode_feedback
